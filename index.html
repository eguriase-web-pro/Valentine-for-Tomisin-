<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>PNGPD LIFE 2.0</title>
<style>
* {
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  touch-action:none;
}

html,body {
  margin:0;
  height:100%;
  overflow:hidden;
  background:#87ceeb;
  font-family:system-ui,sans-serif;
}

canvas {
  display:block;
}

#hud {
  position:fixed;
  top:8px;
  left:8px;
  display:flex;
  flex-direction:column;
  gap:6px;
  pointer-events:none;
  z-index:20;
}

.pill {
  background:#e10600;
  color:#fff;
  font-weight:700;
  padding:6px 12px;
  border-radius:20px;
  font-size:14px;
  width:fit-content;
}

#loc {
  background:#fff;
  color:#e10600;
}

#stats {
  background:rgba(0,0,0,.55);
  color:#fff;
  border-radius:12px;
  padding:6px 10px;
  font-size:13px;
  font-weight:700;
  line-height:1.5;
  display:none;
}

.bar {
  height:7px;
  border-radius:4px;
  background:rgba(255,255,255,.3);
  overflow:hidden;
  width:110px;
}

.bar i {
  display:block;
  height:100%;
}

#mini {
  position:fixed;
  top:8px;
  right:8px;
  width:110px;
  height:110px;
  border-radius:12px;
  border:3px solid #fff;
  background:#2e7d32;
  pointer-events:none;
  z-index:20;
}

#joy {
  position:fixed;
  left:24px;
  bottom:30px;
  width:130px;
  height:130px;
  border-radius:50%;
  background:rgba(255,255,255,.35);
  border:3px solid rgba(255,255,255,.8);
  z-index:20;
}

#knob {
  position:absolute;
  left:35px;
  top:35px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:#e10600;
  border:3px solid #fff;
}

.btn {
  position:fixed;
  border-radius:50%;
  border:3px solid #fff;
  color:#fff;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
}

#run {
  right:24px;
  bottom:30px;
  width:76px;
  height:76px;
  background:#ff9800;
  font-size:14px;
}

#act {
  right:112px;
  bottom:90px;
  width:84px;
  height:84px;
  background:#e10600;
  font-size:15px;
  display:none;
}

#toast {
  position:fixed;
  top:70px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.75);
  color:#fff;
  padding:10px 16px;
  border-radius:12px;
  display:none;
  max-width:70%;
  text-align:center;
  z-index:60;
}

#ov {
  position:fixed;
  inset:0;
  z-index:50;
  background:linear-gradient(160deg,#e10600,#ff9800 60%,#ffeb3b);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  touch-action:auto;
}

#ov * {
  touch-action:auto;
  user-select:auto;
}

.card {
  background:#fff;
  border-radius:20px;
  padding:22px;
  width:100%;
  max-width:340px;
  text-align:center;
}

.card h1 {
  margin:0 0 4px;
  color:#e10600;
  font-size:26px;
}

.card p {
  margin:0 0 14px;
  color:#555;
  font-size:14px;
}

.card button {
  width:100%;
  padding:13px;
  margin-top:8px;
  border:0;
  border-radius:10px;
  font-size:16px;
  font-weight:800;
  color:#fff;
  background:#e10600;
}

#msg2 {
  color:#c00;
  font-size:13px;
  min-height:18px;
  margin-top:6px;
}

.sw {
  display:inline-block;
  width:42px;
  height:42px;
  border-radius:50%;
  margin:5px;
  border:4px solid #fff;
  box-shadow:0 0 0 2px #ccc;
  cursor:pointer;
}

.sw.on {
  box-shadow:0 0 0 3px #000;
}

#panel {
  position:fixed;
  inset:0;
  z-index:40;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:flex-end;
  justify-content:center;
}

#panel * {
  touch-action:auto;
}

#pbox {
  background:#fff;
  width:100%;
  max-width:480px;
  max-height:90%;
  border-radius:20px 20px 0 0;
  display:flex;
  flex-direction:column;
}

#phead {
  padding:14px 16px;
  background:#e10600;
  color:#fff;
  font-weight:800;
  border-radius:20px 20px 0 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#pclose {
  background:#fff;
  color:#e10600;
  border:0;
  border-radius:50%;
  width:32px;
  height:32px;
  font-weight:900;
  font-size:16px;
}

#pbody {
  padding:14px 16px 24px;
  overflow-y:auto;
  color:#222;
  font-size:15px;
  line-height:1.45;
  user-select:text;
}

#pbody ul {
  padding-left:20px;
  margin:8px 0;
}

#pbody li {
  margin:6px 0;
}

.pbtn {
  display:block;
  width:100%;
  padding:12px;
  margin:7px 0;
  border:2px solid #e10600;
  border-radius:10px;
  background:#fff;
  color:#e10600;
  font-weight:700;
  font-size:15px;
  text-align:left;
}

.pbtn.solid {
  background:#e10600;
  color:#fff;
  text-align:center;
}

.pbtn.good {
  background:#4caf50;
  border-color:#4caf50;
  color:#fff;
}

.pbtn.bad {
  background:#e53935;
  border-color:#e53935;
  color:#fff;
}

.note {
  background:#fff3e0;
  border-radius:10px;
  padding:8px 10px;
  font-size:13px;
  margin:8px 0;
}

.fb {
  margin-top:10px;
  font-weight:600;
}

.card input {
  width:100%;
  padding:12px;
  margin:5px 0;
  border:2px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

.card button.alt {
  background:#fff;
  color:#e10600;
  border:2px solid #e10600;
}

#msg {
  color:#c00;
  font-size:13px;
  min-height:18px;
  margin-top:6px;
}

.pbtn.dim {
  opacity:.35;
  pointer-events:none;
  text-decoration:line-through;
}

.expl {
  background:#e8f5e9;
  border-radius:10px;
  padding:8px 10px;
  margin-top:8px;
  font-size:14px;
  font-weight:500;
}

.calcdisp {
  background:#212121;
  color:#fff;
  border-radius:12px;
  padding:10px;
  text-align:right;
  margin-bottom:8px;
  min-height:68px;
  word-break:break-all;
}

#cexp {
  font-size:20px;
}

#cres {
  font-size:26px;
  font-weight:800;
  color:#ffeb3b;
}

.calcgrid {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  margin-bottom:8px;
}

.ck {
  padding:14px 0;
  border:2px solid #e10600;
  border-radius:10px;
  background:#fff;
  color:#e10600;
  font-weight:800;
  font-size:16px;
}

.row {
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px solid #eee;
  font-size:14px;
}

.memo {
  background:#fff8e1;
  border-left:4px solid #e10600;
  border-radius:8px;
  padding:8px 10px;
  margin:8px 0;
}

#clk {
  background:#fff;
  color:#333;
}

#setbtn {
  position:fixed;
  top:calc(126px + env(safe-area-inset-top, 0px));
  right:8px;
  width:40px;
  height:40px;
  border-radius:50%;
  border:2px solid #fff;
  background:rgba(0,0,0,.45);
  color:#fff;
  font-size:20px;
  z-index:21;
  padding:0;
}

.tbar {
  position:relative;
  height:28px;
  background:#ddd;
  border-radius:14px;
  margin:12px 0;
  overflow:hidden;
}

#tz {
  position:absolute;
  top:0;
  bottom:0;
  background:#4caf50;
}

#tm {
  position:absolute;
  top:0;
  bottom:0;
  width:6px;
  background:#e10600;
}

</style>
</head>
<body>
<div id="hud">
  <div class="pill">PNGPD LIFE 2.0</div>

function joyMove(t) {
  const r = joy.getBoundingClientRect(), cx = r.left + 65, cy = r.top + 65;
  let dx = t.clientX - cx, dy = t.clientY - cy;
  const len = Math.hypot(dx, dy), max = 50;
  if (len > max) {
    dx *= max / len;
    dy *= max / len;
  }
  knob.style.left = 35 + dx + "px";
  knob.style.top = 35 + dy + "px";
  jx = dx / max;
  jy = dy / max;
}

  jid = e.changedTouches[0].identifier;
  joyMove(e.changedTouches[0]);
}, { passive: false });

  e.preventDefault();
  for (const t of e.changedTouches)

  openPanel(c.title + " - Quiz", coinLine() + "<div>Question " + (Q.i + 1) + " of " + Q.list.length + " &middot; " + esc(q.cat) + "</div><p><b>" + esc(q.q) + "</b></p>" + Q.opts.map((o, k) => "<button class=\"pbtn" + (Q.dim.includes(k) ? " dim" : "") + "\" data-a=\"opt\" data-v=\"" + k + "\">" + esc(o.t) + "</button>").join("") + "<div id=\"tools\">" + (canHint ? "<button class=\"pbtn\" data-a=\"hint\">Hint: remove 2 wrong options (you earn " + (has("hintpack") ? "75%" : "half") + " of the coins)</button>" : "") + (q.cat === "Calculations" ? "<button class=\"pbtn\" data-a=\"calc\" data-v=\"quiz\">Open calculator</button>" : "") + "</div><div class=\"fb\" id=\"fb\"></div>");

function useHint() {
  if (!Q || Q.locked || Q.hint)
    return;
  const q = Q.list[Q.i];
  const wrong = Q.opts.map((o, k) => k).filter(k => Q.opts[k].i !== q.a);
  Q.dim = shuffle(wrong).slice(0, 2);
  Q.hint = true;
  showQ(true);
}
function explain(code, q) {
  const ans = q.o[q.a];
  const words = t => new Set(t.toLowerCase().match(/[a-z]{4,}/g) || []);
  const qw = words(q.q + " " + ans);
  const own = COURSES[code] && COURSES[code].notes || [];
  const pools = [own].concat(Object.keys(COURSES).filter(k => k !== code).map(k => COURSES[k].notes || []));
  let best = null, bs = 1;
  for (const notes of pools) {
    for (const n of notes) {
      let sc = 0;
      const nw = words(n);
      qw.forEach(w => {
        if (nw.has(w))
          sc++;
      });
      if (sc > bs) {
        bs = sc;
        best = n;
      }
    }
    if (best)
      break;
  }
  let html = "<div class=\"expl\"><b>Correct answer:</b> " + esc(ans) + (best ? "<br><b>Revise this:</b> " + esc(best) : "");
  if (q.cat === "Calculations") {
    const f = own.filter(n => n.includes("=")).slice(0, 4);
    if (f.length)
      html += "<br><b>Formulas for this course:</b><br>" + f.map(esc).join("<br>");
  }
  return html + "</div>";
}
function answer(k) {
  if (!Q || Q.locked || Q.dim.includes(k))
    return;
  Q.locked = true;
  const q = Q.list[Q.i], qc = q._c || Q.code, c = COURSES[qc], ok = Q.opts[k].i === q.a;
  const bs = [...pbody.querySelectorAll("[data-a=\"opt\"]")];
  bs.forEach((b, j) => {
    if (Q.opts[j].i === q.a)
      b.classList.add("good");
  });
  if (!ok)
    bs[k].classList.add("bad");
  pbody.querySelectorAll("[data-a=\"hint\"],[data-a=\"calc\"]").forEach(x => x.remove());
  const sc = P.stats.courses[qc] = P.stats.courses[qc] || {
    a: 0,
    c: 0
  };
  sc.a++;
  if (ok)
    sc.c++;
  if (ok) {
    if (P.stats.wrong[q.id]) {
      delete P.stats.wrong[q.id];
      P.stats.revFixed = (P.stats.revFixed || 0) + 1;
    }
  } else
    P.stats.wrong[q.id] = (P.stats.wrong[q.id] || 0) + 1;
  sfx(ok ? "coin" : "wrong");
  let msg;
  if (ok) {
    Q.right++;
    let rw = q.r || (c.reward || 10) + (q.cat === "Calculations" ? 5 : 0);
    if (has("studypass"))
      rw = Math.round(rw * 1.2);
    rw = Math.round(rw * (Q.mult || 1));
    if (Q.hint)
      rw = Math.max(1, Math.floor(rw * (has("hintpack") ? 0.75 : 0.5)));
    if (!P.done.includes(q.id)) {
      P.done.push(q.id);
      gain(5, rw);
      Q.earned += rw;
      msg = "Correct! +" + rw + " coins" + (Q.hint ? " (hint used, reduced coins)" : "") + (Q.mult > 1 ? " (class test bonus)" : "");
    } else
      msg = "Correct! (already rewarded - practice only)";
  } else
    msg = "Not quite. Here is the explanation:";
  saveProfile(P);
  const last = Q.i >= Q.list.length - 1;
  $("fb").innerHTML = esc(msg) + explain(qc, q) + "<button class=\"pbtn solid\" data-a=\"next\">" + (last ? "FINISH" : "NEXT") + "</button>";
}

let calcTokens = [], calcFrom = "dept";
const CALC_KEYS = [
  "7",
  "8",
  "9",
  "\xF7",
  "DEL",
  "4",
  "5",
  "6",
  "\xD7",
  "C",
  "1",
  "2",
  "3",
  "\u2212",
  "(",
  "0",
  ".",
  "^",
  "+",
  ")",
  "\u221A(",
  "ln(",
  "log(",
  "π",
  "="
];
function calcScreen(from) {
  calcFrom = from || calcFrom;
  openPanel("Calculator", "<div class=\"calcdisp\"><div id=\"cexp\">" + esc(calcTokens.join("") || "0") + "</div><div id=\"cres\"></div></div><div class=\"calcgrid\">" + CALC_KEYS.map(k => "<button class=\"ck\" data-a=\"ck\" data-v=\"" + esc(k) + "\">" + esc(k) + "</button>").join("") + "</div><button class=\"pbtn solid\" data-a=\"calcback\">Back</button>");
}
function calcKey(k) {
  const exp = $("cexp"), res = $("cres");
  if (k === "C") {
    calcTokens = [];
    res.textContent = "";
  } else if (k === "DEL")
    calcTokens.pop();
  else if (k === "=") {
    const map = {
      "\xF7": "/",
      "\xD7": "*",
      "\u2212": "-",
      "^": "**",
      "π": "Math.PI",
      "\u221A(": "Math.sqrt(",
      "ln(": "Math.log(",
      "log(": "Math.log10("
    };
    let js = calcTokens.map(t => map[t] || t).join("");
    const open = (js.match(/\(/g) || []).length - (js.match(/\)/g) || []).length;
    if (open > 0)
      js += ")".repeat(open);
    try {
      const r = new Function("return (" + js + ")")();
      if (typeof r !== "number" || !isFinite(r))
        throw 0;
      const out = String(+r.toPrecision(10));
      res.textContent = "= " + out;
      calcTokens = [out];
    } catch (e) {
      res.textContent = "Error";
    }
  } else {
    calcTokens.push(k);
    res.textContent = "";
  }
  exp.textContent = calcTokens.join("") || "0";
}

function audio() {
  if (!AC) {

  if (AC && AC.state === "suspended")

}
function tone(f, d, type, vol, delay) {
  const a = audio();
  if (!a)
    return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (delay || 0);
  o.type = type || "square";
  o.frequency.value = f;
  g.gain.setValueAtTime(vol || 0.05, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g);
  g.connect(a.destination);
  o.start(t);
  o.stop(t + d + 0.02);
}

  };

function blocked(x, z) {
  return solids.some(s => Math.abs(x - s.x) < s.hw && Math.abs(z - s.z) < s.hd) || Math.abs(x) > 150 || z > 85 || z < -95;
}

const mini = $("mini"), mg = mini.getContext("2d");
const mx = x => (x + 100) / 200 * 220, mz = z => (z + 100) / 180 * 220;
function drawMini() {
  mg.clearRect(0, 0, 220, 220);
  mg.fillStyle = "#444";
  mg.fillRect(mx(-5), 0, 12, 220);
  mg.fillRect(0, mz(-26), 220, 9);
  mg.fillRect(0, mz(10), 220, 9);
  mg.fillStyle = "#ffeb3b";
  places.forEach(p => mg.fillRect(mx(p[2]) - 5, mz(p[3]) - 4, 10, 8));
  mg.fillStyle = "#fff";
  mg.beginPath();
  mg.arc(mx(player.position.x), mz(player.position.z), 6, 0, Math.PI * 2);
  mg.fill();
  mg.fillStyle = "#e10600";

}

// ===== LOOP =====
let gameMin = 8 * 60, clkN = 0;
const NIGHT = new THREE.Color(858941), DAY = new THREE.Color(8900331), skyNow = new THREE.Color();
function updateSky(dt) {
  gameMin += dt * 2;
  const hr = gameMin / 60 % 24, f = Math.max(0, Math.sin((hr - 6) / 12 * Math.PI));
  skyNow.copy(NIGHT).lerp(DAY, f);
  scene.background.copy(skyNow);
  scene.fog.color.copy(skyNow);
  hemi.intensity = 0.35 + 0.55 * f;
  sun.intensity = 0.1 + 0.5 * f;
  clouds.forEach(c => {
    c.position.x += dt * 1.5;
    if (c.position.x > 160)
      c.position.x = -160;
    c.material.color.setScalar(0.25 + 0.75 * f);
  });
  if ((clkN += 1) % 15 === 0) {
    const pad = n => (n < 10 ? "0" : "") + n;
    $("clk").textContent = "Day " + (Math.floor(gameMin / 1440) + 1) + " - " + pad(Math.floor(hr)) + ":" + pad(Math.floor(hr % 1 * 60));
  }
}
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  updateSky(dt);
  const ix = jx + (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  const iy = jy + (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
  const mag = P && !inPanel ? Math.min(1, Math.hypot(ix, iy)) : 0;
  const wantRun = (running || keys.shift) && P && P.energy > 1 && P.hunger > 5;
  if (mag > 0.08) {
    const sp = (wantRun ? 13 : 6.5) * vehMult() * mag * dt;
    if (wantRun)
      P.energy = Math.max(0, P.energy - 4 * dt * (has("boots") ? 0.7 : 1));
    const fx = -Math.sin(camAng), fz = -Math.cos(camAng), rx = Math.cos(camAng), rz = -Math.sin(camAng);
    const l = Math.hypot(ix, iy);
    const dx = (rx * ix / l - fx * iy / l) * sp, dz = (rz * ix / l - fz * iy / l) * sp;
    const nx = player.position.x + dx, nz = player.position.z + dz;
    if (!blocked(nx, player.position.z))
      player.position.x = nx;
    if (!blocked(player.position.x, nz))
      player.position.z = nz;
    player.rotation.y = Math.atan2(dx, dz);
    animChar(player, true, performance.now() / 1000, vehGroup ? 0 : 11);
  }
  if (mag <= 0.08)
    animChar(player, false);
  if (P && mag <= 0.08)
    P.energy = Math.min(100, P.energy + 3 * dt * (has("backpack") ? 1.5 : 1));
  npcs.forEach(n => {
    n.t += n.dir * n.sp * dt;
    if (n.t > 1) {
      n.t = 1;
      n.dir = -1;
    }
    if (n.t < 0) {
      n.t = 0;
      n.dir = 1;
    }
    const [a, b, c, d] = n.p;
    n.c.position.set(a + (c - a) * n.t, 0, b + (d - b) * n.t);
    n.c.rotation.y = Math.atan2((c - a) * n.dir, (d - b) * n.dir);
    animChar(n.c, true, performance.now() / 1000 + n.sp * 300, 9);
  });
  const d = 11, h = 7;
  const tx = player.position.x + Math.sin(camAng) * d, tz = player.position.z + Math.cos(camAng) * d;
  cam.position.x += (tx - cam.position.x) * 0.1;
  cam.position.z += (tz - cam.position.z) * 0.1;
  cam.position.y += (h - cam.position.y) * 0.1;
  cam.lookAt(player.position.x, 2, player.position.z);
  near = null;
  let best = 1000000000;
  spots.forEach(s => {
    const dd = Math.hypot(player.position.x - s.x, player.position.z - s.z);
    if (dd < (s.r || 6) && dd < best) {
      best = dd;
      near = s;
    }
  });
  nearNpc = null;
  if (!near) {
    let bd = 4;
    npcs.forEach(n => {
      const dd = Math.hypot(player.position.x - n.c.position.x, player.position.z - n.c.position.z);
      if (dd < bd) {
        bd = dd;
        nearNpc = n;
      }
    });
  }
  if (near) {
    locEl.textContent = near.n;
    actBtn.textContent = "ENTER";
    actBtn.style.display = near.r || inPanel ? "none" : "flex";
  } else if (nearNpc) {
    locEl.textContent = "PTI Campus";
    actBtn.textContent = "TALK";
    actBtn.style.display = inPanel ? "none" : "flex";
  } else {
    locEl.textContent = "PTI Campus";
    actBtn.style.display = "none";
  }
  drawMini();
  if (P)
    drawStats();
  ren.render(scene, cam);
}
cam.position.set(0, 7, 76);
loop();
