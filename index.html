<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>PNGPD LIFE 2.0</title>
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: none;
}

html,body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #87ceeb;
  font-family: system-ui,sans-serif;
}

canvas {
  display: block;
}

#hud {
  position: fixed;
  top: 8px;
  left: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  pointer-events: none;
  z-index: 20;
}

.pill {
  background: #e10600;
  color: #fff;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 14px;
  width: fit-content;
}

#loc {
  background: #fff;
  color: #e10600;
}

#stats {
  background: rgba(0,0,0,.55);
  color: #fff;
  border-radius: 12px;
  padding: 6px 10px;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.5;
  display: none;
}

.bar {
  height: 7px;
  border-radius: 4px;
  background: rgba(255,255,255,.3);
  overflow: hidden;
  width: 110px;
}

.bar i {
  display: block;
  height: 100%;
}

#mini {
  position: fixed;
  top: 8px;
  right: 8px;
  width: 110px;
  height: 110px;
  border-radius: 12px;
  border: 3px solid #fff;
  background: #2e7d32;
  pointer-events: none;
  z-index: 20;
}

#joy {
  position: fixed;
  left: 24px;
  bottom: 30px;
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: rgba(255,255,255,.35);
  border: 3px solid rgba(255,255,255,.8);
  z-index: 20;
}

#knob {
  position: absolute;
  left: 35px;
  top: 35px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #e10600;
  border: 3px solid #fff;
}

.btn {
  position: fixed;
  border-radius: 50%;
  border: 3px solid #fff;
  color: #fff;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 20;
}

#run {
  right: 24px;
  bottom: 30px;
  width: 76px;
  height: 76px;
  background: #ff9800;
  font-size: 14px;
}

#act {
  right: 112px;
  bottom: 90px;
  width: 84px;
  height: 84px;
  background: #e10600;
  font-size: 15px;
  display: none;
}

#toast {
  position: fixed;
  top: 70px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.75);
  color: #fff;
  padding: 10px 16px;
  border-radius: 12px;
  display: none;
  max-width: 70%;
  text-align: center;
  z-index: 60;
}

#ov {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: linear-gradient(160deg,#e10600,#ff9800 60%,#ffeb3b);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  touch-action: auto;
}

#ov * {
  touch-action: auto;
  user-select: auto;
}

.card {
  background: #fff;
  border-radius: 20px;
  padding: 22px;
  width: 100%;
  max-width: 340px;
  text-align: center;
}

.card h1 {
  margin: 0 0 4px;
  color: #e10600;
  font-size: 26px;
}

.card p {
  margin: 0 0 14px;
  color: #555;
  font-size: 14px;
}

.card button {
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 800;
  color: #fff;
  background: #e10600;
}

#msg2 {
  color: #c00;
  font-size: 13px;
  min-height: 18px;
  margin-top: 6px;
}

.sw {
  display: inline-block;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  margin: 5px;
  border: 4px solid #fff;
  box-shadow: 0 0 0 2px #ccc;
  cursor: pointer;
}

.sw.on {
  box-shadow: 0 0 0 3px #000;
}

#panel {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: rgba(0,0,0,.6);
  display: none;
  align-items: flex-end;
  justify-content: center;
}

#panel * {
  touch-action: auto;
}

#pbox {
  background: #fff;
  width: 100%;
  max-width: 480px;
  max-height: 90%;
  border-radius: 20px 20px 0 0;
  display: flex;
  flex-direction: column;
}

#phead {
  padding: 14px 16px;
  background: #e10600;
  color: #fff;
  font-weight: 800;
  border-radius: 20px 20px 0 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#pclose {
  background: #fff;
  color: #e10600;
  border: 0;
  border-radius: 50%;
  width: 32px;
  height: 32px;
  font-weight: 900;
  font-size: 16px;
}

#pbody {
  padding: 14px 16px 24px;
  overflow-y: auto;
  color: #222;
  font-size: 15px;
  line-height: 1.45;
  user-select: text;
}

#pbody ul {
  padding-left: 20px;
  margin: 8px 0;
}

#pbody li {
  margin: 6px 0;
}

.pbtn {
  display: block;
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  border: 2px solid #e10600;
  border-radius: 10px;
  background: #fff;
  color: #e10600;
  font-weight: 700;
  font-size: 15px;
  text-align: left;
}

.pbtn.solid {
  background: #e10600;
  color: #fff;
  text-align: center;
}

.pbtn.good {
  background: #4caf50;
  border-color: #4caf50;
  color: #fff;
}

.pbtn.bad {
  background: #e53935;
  border-color: #e53935;
  color: #fff;
}

.note {
  background: #fff3e0;
  border-radius: 10px;
  padding: 8px 10px;
  font-size: 13px;
  margin: 8px 0;
}

.fb {
  margin-top: 10px;
  font-weight: 600;
}

.card input {
  width: 100%;
  padding: 12px;
  margin: 5px 0;
  border: 2px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
}

.card button.alt {
  background: #fff;
  color: #e10600;
  border: 2px solid #e10600;
}

#msg {
  color: #c00;
  font-size: 13px;
  min-height: 18px;
  margin-top: 6px;
}

.pbtn.dim {
  opacity: .35;
  pointer-events: none;
  text-decoration: line-through;
}

.expl {
  background: #e8f5e9;
  border-radius: 10px;
  padding: 8px 10px;
  margin-top: 8px;
  font-size: 14px;
  font-weight: 500;
}

.calcdisp {
  background: #212121;
  color: #fff;
  border-radius: 12px;
  padding: 10px;
  text-align: right;
  margin-bottom: 8px;
  min-height: 68px;
  word-break: break-all;
}

#cexp {
  font-size: 20px;
}

#cres {
  font-size: 26px;
  font-weight: 800;
  color: #ffeb3b;
}

.calcgrid {
  display: grid;
  grid-template-columns: repeat(5,1fr);
  gap: 6px;
  margin-bottom: 8px;
}

.ck {
  padding: 14px 0;
  border: 2px solid #e10600;
  border-radius: 10px;
  background: #fff;
  color: #e10600;
  font-weight: 800;
  font-size: 16px;
}

.row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid #eee;
  font-size: 14px;
}

.memo {
  background: #fff8e1;
  border-left: 4px solid #e10600;
  border-radius: 8px;
  padding: 8px 10px;
  margin: 8px 0;
}

</style>
</head>
<body>
<div id="hud">
  <div class="pill">PNGPD LIFE 2.0</div>
  <div class="pill" id="loc">PTI Entrance</div>
  <div id="stats"></div>
</div>
<canvas id="mini" width="220" height="220"></canvas>
<div id="toast"></div>

<div id="ov">
  <div class="card" id="c1" style="display:none">
    <h1>PNGPD LIFE 2.0</h1>
    <p>Your virtual life at PTI Effurun</p>
    <input id="un" placeholder="Username" autocapitalize="none" autocomplete="username">
    <input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
    <button id="bl">LOGIN</button>
    <button class="alt" id="br">CREATE ACCOUNT</button>
    <button class="alt" id="boff">PLAY OFFLINE (this phone only)</button>
    <div id="msg"></div>
  </div>
  <div class="card" id="c2" style="display:none">
    <h1>Create Character</h1>
    <input id="pname" placeholder="Your name" maxlength="16">
    <p>Pick your shirt colour</p>
    <div id="sws"></div>
    <button id="bgo">ENTER PTI</button>
    <div id="msg2"></div>
  </div>
</div>

<div id="panel"><div id="pbox">
  <div id="phead"><span id="ptitle"></span><button id="pclose">X</button></div>
  <div id="pbody"></div>
</div></div>

<div id="joy"><div id="knob"></div></div>
<div class="btn" id="run">RUN</div>
<div class="btn" id="act">ENTER</div>

notes: [

  "Fluid statics - study of fluids at rest.",
  "Velocity - rate of change of position of a fluid particle with time.",

quiz: [

  {id:"PGP121-Q02", cat:"Concepts", q:"Define fluid dynamics.", o:["Flow properties at a fixed point remain constant with time", "The study of fluid motion without considering the forces causing the motion", "Study of fluid motion together with the forces producing the motion", "Mass flowing through a section per unit time"], a:2},

  {id:"PGP121-Q05", cat:"Concepts", q:"Define acceleration.", o:["Flow properties at a fixed point remain constant with time", "Flow properties change with time at a fixed point", "Rate of change of velocity with time", "Smooth, orderly flow in layers"], a:2},

  {id:"PGP121-Q07", cat:"Concepts", q:"Distinguish between streamline and pathline.", o:["Magnitude and direction of velocity", "Velocity decreases", "Smooth, orderly flow in layers", "A streamline represents instantaneous flow direction; a pathline is the actual path of a fluid particle"], a:3},
  {id:"PGP121-Q08", cat:"Concepts", q:"What is a streakline?", o:["Spatial description of flow properties such as velocity", "The locus of particles that have passed through a particular point", "Magnitude and direction of velocity", "Volumetric flow measures volume/time; mass flow measures mass/time"], a:1},
  {id:"PGP121-Q09", cat:"Concepts", q:"Define steady flow.", o:["Mass cannot be created or destroyed in a closed system", "Mass flowing through a section per unit time", "Flow properties at a fixed point remain constant with time", "Study of fluid motion together with the forces producing the motion"], a:2},

  {id:"PGP121-Q16", cat:"Concepts", q:"What is rotational flow?", o:["Flow in which fluid elements rotate", "A line tangent to the instantaneous velocity direction at every point", "Spatial description of flow properties such as velocity", "The locus of particles that have passed through a particular point"], a:0},
